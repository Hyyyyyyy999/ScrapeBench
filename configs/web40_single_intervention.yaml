run:
  name: web40_single_intervention
  seed: 20261016
  data_root: data/web40
  resolution: 512
  samples_per_cell: 4
  ref_per_id: 2
  tau: 0.30
  sd_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  fp16: true

# Every intervention consumes the same protected T0 image independently.
stage_a:
  methods: [clean, gapdiff, metacloak, goodac, arcp_web_v4]
  tiers: [t0, t1_jpeg70, t2_canvas_dpr1, t3_agent_facecrop, t4_sr_x2, t5_i2i30, t6_sde35]
  ids: [all]
  save_outputs: true
  prompts:
    - "a clean front-facing portrait of a person for a social media avatar"
    - "a casual smartphone selfie of a person"
    - "a low-light indoor social photo of a person"
    - "an outdoor travel photo of a person with a detailed background"

stage_b:
  methods: [clean, gapdiff, metacloak, goodac, arcp_web_v4]
  tiers: [t0, t1_jpeg70, t2_canvas_dpr1, t3_agent_facecrop, t4_sr_x2, t5_i2i30, t6_sde35]
  ids: [all]
  steps: 1000
  model: /mnt/beegfs/home/huangyue26/GAP-Diff/stable-diffusion/stable-diffusion-2-1-base
  class_data_dir: /mnt/beegfs/home/huangyue26/GAP-Diff/data/class-person-2-1
  num_class_images: 200
  class_prompt: "a photo of person"
  prior_loss_weight: 1.0
  training_mode: full_unet
  batch_size: 1
  lr: 0.0000005
  prompt: "a photo of sks person"
  prompts:
    - "a clean front-facing portrait of sks person for a social media avatar"
    - "a casual smartphone selfie of sks person"
    - "a low-light indoor social photo of sks person"
    - "an outdoor travel photo of sks person with a detailed background"
  samples_per_prompt: 8
  generation_steps: 30
  save_outputs: true

protection:
  # External released-code baselines are generated by the dedicated wrapper.
  methods: [clean, arcp_web_v4]
  eps: 16.0
  arcp_v2_eps_max: 16.0
  arcp_v2_eps_min: 2.0
  arcp_v2_steps: 200
  arcp_v2_z_step: 0.10
  arcp_v2_lam: 0.75
  arcp_v2_margin: 0.35
  arcp_v2_grid: 64
  arcp_v2_eot_depth: 1
  arcp_web_eps_max: 16.0
  arcp_web_eps_min: 2.0
  arcp_web_steps: 280
  arcp_web_z_step: 0.075
  arcp_web_lam: 0.85
  arcp_web_margin: 0.30
  arcp_web_grid: 64
  arcp_web_eot_depth: 1
  arcp_web_survival_weight: 0.10
  arcp_web_gap_margin: 0.15
  # ARCP-Web-v2 is evaluated under the same 16/255 L_inf ceiling.  It uses
  # more of the available perceptual budget and avoids the original hard
  # reader-loss plateau; it remains a candidate until the held-out gate wins.
  arcp_web_v2_eps_max: 16.0
  arcp_web_v2_eps_min: 6.0
  arcp_web_v2_steps: 360
  arcp_web_v2_z_step: 0.05
  arcp_web_v2_lam: 1.40
  arcp_web_v2_margin: 0.05
  arcp_web_v2_grid: 128
  arcp_web_v2_eot_depth: 1
  arcp_web_v2_survival_weight: 0.50
  arcp_web_v2_gap_margin: 0.30
  arcp_web_v2_reader_softplus_beta: 8.0
  # V3 is a standalone clean-to-protected ARCP method.  A low-frequency branch
  # carries protection through Web processing; a full-resolution branch and a
  # mandatory T0 loss preserve strength before processing.  It never reads or
  # initializes from GAP-Diff/IDProtector outputs.
  arcp_web_v3_eps_max: 16.0
  arcp_web_v3_eps_min: 6.0
  arcp_web_v3_steps: 480
  arcp_web_v3_z_step: 0.04
  arcp_web_v3_lam: 1.80
  arcp_web_v3_margin: -0.05
  arcp_web_v3_grid: 128
  arcp_web_v3_detail_grid: 512
  arcp_web_v3_detail_weight: 0.45
  arcp_web_v3_eot_depth: 1
  arcp_web_v3_random_start: true
  arcp_web_v3_survival_weight: 0.60
  arcp_web_v3_gap_margin: 0.40
  arcp_web_v3_reader_softplus_beta: 12.0
  arcp_web_v3_dual_t0: true
  arcp_web_v3_t0_weight: 1.25
  arcp_web_v3_reader_multiview: true
  # V4 is the frozen matched-budget paper method. Unlike V2/V3 it optimizes a
  # differentiable copy of InstantID's ArcFace recognizer, using clean-image
  # detections only for fixed geometric alignment.
  arcp_web_v4_eps_max: 8.0
  arcp_web_v4_eps_min: 3.0
  arcp_web_v4_steps: 600
  arcp_web_v4_z_step: 0.035
  arcp_web_v4_lam: 1.20
  arcp_web_v4_margin: 0.10
  arcp_web_v4_grid: 128
  arcp_web_v4_detail_grid: 512
  arcp_web_v4_detail_weight: 0.55
  arcp_web_v4_eot_depth: 1
  arcp_web_v4_random_start: true
  arcp_web_v4_survival_weight: 0.35
  arcp_web_v4_gap_margin: 0.25
  arcp_web_v4_reader_softplus_beta: 10.0
  arcp_web_v4_dual_t0: true
  arcp_web_v4_t0_weight: 1.50
  arcp_web_v4_reader_multiview: true
  arcp_web_v4_arcface_weight: 2.0
  # Mechanism ablations copy every V4 hyperparameter; exactly one mechanism is
  # disabled in each block.  These are a four-identity diagnostic, not a
  # substitute for the 40-identity primary comparison.
  arcp_web_v4_uniform_eps_max: 8.0
  arcp_web_v4_uniform_eps_min: 3.0
  arcp_web_v4_uniform_steps: 600
  arcp_web_v4_uniform_z_step: 0.035
  arcp_web_v4_uniform_lam: 1.20
  arcp_web_v4_uniform_margin: 0.10
  arcp_web_v4_uniform_grid: 128
  arcp_web_v4_uniform_detail_grid: 512
  arcp_web_v4_uniform_detail_weight: 0.55
  arcp_web_v4_uniform_eot_depth: 1
  arcp_web_v4_uniform_random_start: true
  arcp_web_v4_uniform_survival_weight: 0.35
  arcp_web_v4_uniform_gap_margin: 0.25
  arcp_web_v4_uniform_reader_softplus_beta: 10.0
  arcp_web_v4_uniform_dual_t0: true
  arcp_web_v4_uniform_t0_weight: 1.50
  arcp_web_v4_uniform_reader_multiview: true
  arcp_web_v4_uniform_arcface_weight: 2.0
  arcp_web_v4_uniform_adaptive_weak: false

  arcp_web_v4_no_texture_eps_max: 8.0
  arcp_web_v4_no_texture_eps_min: 3.0
  arcp_web_v4_no_texture_steps: 600
  arcp_web_v4_no_texture_z_step: 0.035
  arcp_web_v4_no_texture_lam: 1.20
  arcp_web_v4_no_texture_margin: 0.10
  arcp_web_v4_no_texture_grid: 128
  arcp_web_v4_no_texture_detail_grid: 512
  arcp_web_v4_no_texture_detail_weight: 0.55
  arcp_web_v4_no_texture_eot_depth: 1
  arcp_web_v4_no_texture_random_start: true
  arcp_web_v4_no_texture_survival_weight: 0.35
  arcp_web_v4_no_texture_gap_margin: 0.25
  arcp_web_v4_no_texture_reader_softplus_beta: 10.0
  arcp_web_v4_no_texture_dual_t0: true
  arcp_web_v4_no_texture_t0_weight: 1.50
  arcp_web_v4_no_texture_reader_multiview: true
  arcp_web_v4_no_texture_arcface_weight: 2.0
  arcp_web_v4_no_texture_texture_aware: false

  arcp_web_v4_no_coarse_eps_max: 8.0
