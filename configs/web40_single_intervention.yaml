  arcp_web_v4_no_coarse_arcface_weight: 2.0

  arcp_web_v4_no_detail_eps_max: 8.0
  arcp_web_v4_no_detail_eps_min: 3.0
  arcp_web_v4_no_detail_steps: 600
  arcp_web_v4_no_detail_z_step: 0.035
  arcp_web_v4_no_detail_lam: 1.20
  arcp_web_v4_no_detail_margin: 0.10
  arcp_web_v4_no_detail_grid: 128
  arcp_web_v4_no_detail_detail_grid: 0
