  arcp_web_v4_no_detail_eot_depth: 1
  arcp_web_v4_no_detail_random_start: true
  arcp_web_v4_no_detail_survival_weight: 0.35
  arcp_web_v4_no_detail_gap_margin: 0.25
  arcp_web_v4_no_detail_reader_softplus_beta: 10.0
  arcp_web_v4_no_detail_dual_t0: true
  arcp_web_v4_no_detail_t0_weight: 1.50
  arcp_web_v4_no_detail_reader_multiview: true
  arcp_web_v4_no_detail_arcface_weight: 2.0

  arcp_web_v4_no_identity_eps_max: 8.0
  arcp_web_v4_no_identity_eps_min: 3.0
  arcp_web_v4_no_identity_steps: 600
  arcp_web_v4_no_identity_z_step: 0.035
  arcp_web_v4_no_identity_lam: 1.20
  arcp_web_v4_no_identity_margin: 0.10
  arcp_web_v4_no_identity_grid: 128
  arcp_web_v4_no_identity_detail_grid: 512
  arcp_web_v4_no_identity_detail_weight: 0.55
  arcp_web_v4_no_identity_eot_depth: 1
  arcp_web_v4_no_identity_random_start: true
